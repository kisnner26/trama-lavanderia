name: verificar backend
on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        php: ['8.3', '8.5']
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: trama_testing
          MYSQL_ROOT_PASSWORD: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - name: pruebas sqlite
        run: composer test
      - name: pruebas mysql
        run: composer test
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: trama_testing
          DB_USERNAME: root
          DB_PASSWORD: testing
